<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sifreni Sifirla — InterviewPilot AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="assets/style.css">
<style>
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .auth-glow { position: absolute; top: -200px; left: 50%; transform: translateX(-50%); width: 800px; height: 500px; background: var(--grad-brand); opacity: .16; filter: blur(120px); border-radius: 50%; }
  .auth-card { width: 420px; position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-glow"></div>
  <div class="auth-card">
    <div class="text-center" style="margin-bottom:24px;">
      <div class="brand" style="justify-content:center; margin-bottom:16px;"><div class="brand-mark">IP</div>InterviewPilot <span class="gradient-text">AI</span></div>
      <div class="feature-icon" style="margin:0 auto 16px; width:52px; height:52px;"><i data-lucide="lock-keyhole"></i></div>
      <h2 class="h3">Yeni sifre belirle</h2>
      <p style="margin-top:6px;">Hesabin icin yeni bir sifre olustur</p>
    </div>
    <div class="card card-glow" style="padding:32px;" id="formCard">
      <label class="field-label">Yeni Sifre</label>
      <input class="input" type="password" id="pwInput" placeholder="En az 6 karakter" style="margin-bottom:14px;">
      <label class="field-label">Yeni Sifre (Tekrar)</label>
      <input class="input" type="password" id="pw2Input" placeholder="••••••••" style="margin-bottom:8px;">
      <div class="room-error hidden" id="rpError" style="background:var(--danger-soft); color:var(--danger); border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:14px;"></div>
      <button class="btn btn-primary" id="resetBtn" style="width:100%;">Sifreyi Guncelle</button>
    </div>
    <div class="card card-glow hidden text-center" id="successCard" style="padding:32px;">
      <i data-lucide="check-circle-2" style="width:36px; height:36px; color:var(--success);"></i>
      <p style="margin-top:10px; font-weight:700;">Sifren guncellendi</p>
      <a href="login.html" class="btn btn-primary" style="width:100%; margin-top:16px;">Giris Yap</a>
    </div>
    <p class="text-center" style="margin-top:20px; font-size:14px;"><a href="login.html" style="color:var(--indigo-600); font-weight:700;">← Giris ekranina don</a></p>
  </div>
</div>
<script>
  lucide.createIcons();

  const token = new URLSearchParams(location.search).get("token");
  if (!token) {
    document.getElementById("formCard").innerHTML =
      '<p class="faint" style="font-size:13.5px;">Gecersiz link. Sifremi Unuttum akisini yeniden baslatmalisin.</p>' +
      '<a href="forgot-password.html" class="btn btn-primary" style="width:100%; margin-top:14px;">Sifremi Unuttum</a>';
  }

  document.getElementById("resetBtn")?.addEventListener("click", async () => {
    const pw = document.getElementById("pwInput").value;
    const pw2 = document.getElementById("pw2Input").value;
    const errEl = document.getElementById("rpError");
    errEl.classList.add("hidden");

    if (pw.length < 6) { errEl.textContent = "Sifre en az 6 karakter olmali"; errEl.classList.remove("hidden"); return; }
    if (pw !== pw2) { errEl.textContent = "Sifreler eslesmiyor"; errEl.classList.remove("hidden"); return; }

    const btn = document.getElementById("resetBtn");
    btn.disabled = true;
    btn.textContent = "Guncelleniyor...";
    try {
      const r = await fetch("/api/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, new_password: pw }),
      });
      if (!r.ok) {
        const data = await r.json().catch(() => ({}));
        throw new Error(data.detail || "Sifre guncellenemedi");
      }
      document.getElementById("formCard").classList.add("hidden");
      document.getElementById("successCard").classList.remove("hidden");
    } catch (e) {
      errEl.textContent = e.message;
      errEl.classList.remove("hidden");
      btn.disabled = false;
      btn.textContent = "Sifreyi Guncelle";
    }
  });
</script>
</body>
</html>
