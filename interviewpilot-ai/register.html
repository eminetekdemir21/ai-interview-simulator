<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayit — InterviewPilot AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="assets/style.css">
<style>
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; padding: 40px 16px; }
  .auth-glow { position: absolute; top: -200px; left: 50%; transform: translateX(-50%); width: 800px; height: 500px; background: var(--grad-brand); opacity: .16; filter: blur(120px); border-radius: 50%; }
  .auth-card { width: 420px; position: relative; z-index: 1; text-align:center; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-glow"></div>
  <div class="auth-card">
    <div class="brand" style="justify-content:center; margin-bottom:16px;"><div class="brand-mark">IP</div>InterviewPilot <span class="gradient-text">AI</span></div>
    <div class="card card-glow" style="padding:32px;">
      <i data-lucide="user-check" style="width:36px; height:36px; color:var(--indigo);"></i>
      <h3 class="h3" style="margin-top:14px;">Bu tek kullanicili bir uygulama</h3>
      <p class="faint" style="margin-top:8px; font-size:14px;">Ayri bir hesap olusturmana gerek yok. Sadece giris sifresiyle icerideki mulakat pratiklerine devam edebilirsin.</p>
      <a href="login.html" class="btn btn-primary" style="width:100%; margin-top:20px;">Giris Sayfasina Git</a>
    </div>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
