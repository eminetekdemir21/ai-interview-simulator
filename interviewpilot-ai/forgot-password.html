<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sifremi Unuttum — InterviewPilot AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="assets/style.css">
<style>
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .auth-glow { position: absolute; top: -200px; left: 50%; transform: translateX(-50%); width: 800px; height: 500px; background: var(--grad-brand); opacity: .16; filter: blur(120px); border-radius: 50%; }
  .auth-card { width: 420px; position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-glow"></div>
  <div class="auth-card">
    <div class="text-center" style="margin-bottom:24px;">
      <div class="brand" style="justify-content:center; margin-bottom:16px;"><div class="brand-mark">IP</div>InterviewPilot <span class="gradient-text">AI</span></div>
      <div class="feature-icon" style="margin:0 auto 16px; width:52px; height:52px;"><i data-lucide="key-round"></i></div>
      <h2 class="h3">Sifreni mi unuttun?</h2>
      <p style="margin-top:6px;">E-postani gir, sana sifirlama linki gonderelim</p>
    </div>
    <div class="card card-glow" style="padding:32px;">
      <label class="field-label">E-posta</label>
      <input class="input" type="email" id="emailInput" placeholder="ornek@email.com" style="margin-bottom:12px;">
      <div class="room-error hidden" id="fpError" style="background:var(--danger-soft); color:var(--danger); border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:12px;"></div>
      <div class="hidden" id="fpSuccess" style="background:var(--success-soft); color:var(--success); border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:12px;">Bu e-posta kayitliysa, sifirlama linki gonderildi. Gelen kutunu (ve spam klasorunu) kontrol et.</div>
      <button class="btn btn-primary" id="sendBtn" style="width:100%;">Sifirlama Linki Gonder</button>
    </div>
    <p class="text-center" style="margin-top:20px; font-size:14px;"><a href="login.html" style="color:var(--indigo-600); font-weight:700;">← Giris ekranina don</a></p>
  </div>
</div>
<script>
  lucide.createIcons();

  document.getElementById("sendBtn").addEventListener("click", async () => {
    const email = document.getElementById("emailInput").value.trim();
    const errEl = document.getElementById("fpError");
    const okEl = document.getElementById("fpSuccess");
    errEl.classList.add("hidden");
    okEl.classList.add("hidden");
    if (!email || !email.includes("@")) {
      errEl.textContent = "Gecerli bir e-posta gir";
      errEl.classList.remove("hidden");
      return;
    }
    const btn = document.getElementById("sendBtn");
    btn.disabled = true;
    btn.textContent = "Gonderiliyor...";
    try {
      const r = await fetch("/api/forgot-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      if (!r.ok) {
        const data = await r.json().catch(() => ({}));
        throw new Error(data.detail || "Istek basarisiz");
      }
      okEl.classList.remove("hidden");
      document.getElementById("emailInput").value = "";
    } catch (e) {
      errEl.textContent = e.message;
      errEl.classList.remove("hidden");
    } finally {
      btn.disabled = false;
      btn.textContent = "Sifirlama Linki Gonder";
    }
  });
</script>
</body>
</html>
