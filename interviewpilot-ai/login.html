<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giris Yap — InterviewPilot AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="assets/style.css">
<style>
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .auth-glow { position: absolute; top: -200px; left: 50%; transform: translateX(-50%); width: 800px; height: 500px; background: var(--grad-brand); opacity: .16; filter: blur(120px); border-radius: 50%; }
  .auth-card { width: 420px; position: relative; z-index: 1; }
  .divider { display:flex; align-items:center; gap:12px; color:var(--text-faint); font-size:12.5px; margin: 20px 0; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--border); }
  .social-btn { display:flex; align-items:center; justify-content:center; gap:10px; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-glow"></div>
  <div class="auth-card">
    <div class="text-center" style="margin-bottom:28px;">
      <div class="brand" style="justify-content:center; margin-bottom:16px;"><div class="brand-mark">IP</div>InterviewPilot <span class="gradient-text">AI</span></div>
      <h2 class="h3">Tekrar hos geldin</h2>
      <p style="margin-top:6px;">Mulakat pratigine kaldigin yerden devam et</p>
    </div>
    <div class="card card-glow" style="padding:32px;">
      <label class="field-label">Sifre</label>
      <input class="input" type="password" id="pwInput" placeholder="••••••••" style="margin-bottom:8px;">
      <div class="room-error hidden" id="loginError" style="background:var(--danger-soft); color:var(--danger); border-radius:12px; padding:10px 14px; font-size:13px; margin-bottom:14px;"></div>
      <button class="btn btn-primary" id="loginBtn" style="width:100%;">Giris Yap</button>
    </div>
    <p class="text-center" style="margin-top:20px; font-size:13px; color:var(--text-faint);">Bu tek kullanicili bir demo projedir, kayit gerekmez.</p>
  </div>
</div>
<script>
  lucide.createIcons();

  function showError(msg) {
    const el = document.getElementById("loginError");
    el.textContent = msg;
    el.classList.remove("hidden");
  }

  async function doLogin() {
    const password = document.getElementById("pwInput").value;
    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.textContent = "Giris yapiliyor...";
    try {
      const r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password }),
      });
      if (!r.ok) {
        const data = await r.json().catch(() => ({}));
        throw new Error(data.detail || "Giris basarisiz");
      }
      localStorage.setItem("ip_authed", "1");
      const params = new URLSearchParams(location.search);
      window.location.href = params.get("next") || "dashboard.html";
    } catch (e) {
      showError(e.message);
      btn.disabled = false;
      btn.textContent = "Giris Yap";
    }
  }

  document.getElementById("loginBtn").addEventListener("click", doLogin);
  document.getElementById("pwInput").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
</script>
</body>
</html>
