<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giris Yap — InterviewPilot AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="stylesheet" href="assets/style.css">
<style>
  .auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
  .auth-glow { position: absolute; top: -200px; left: 50%; transform: translateX(-50%); width: 800px; height: 500px; background: var(--grad-brand); opacity: .16; filter: blur(120px); border-radius: 50%; }
  .auth-card { width: 420px; position: relative; z-index: 1; }
  .divider { display:flex; align-items:center; gap:12px; color:var(--text-faint); font-size:12.5px; margin: 20px 0; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--border); }
  .social-btn { display:flex; align-items:center; justify-content:center; gap:10px; }
</style>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-glow"></div>
  <div class="auth-card">
    <div class="text-center" style="margin-bottom:28px;">
      <div class="brand" style="justify-content:center; margin-bottom:16px;"><div class="brand-mark">IP</div>InterviewPilot <span class="gradient-text">AI</span></div>
      <h2 class="h3">Tekrar hos geldin</h2>
      <p style="margin-top:6px;">Mulakat pratigine kaldigin yerden devam et</p>
    </div>
    <div class="card card-glow" style="padding:32px;">
      <label class="field-label">E-posta</label>
      <input class="input" type="email" placeholder="ornek@email.com" style="margin-bottom:16px;">
      <label class="field-label">Sifre</label>
      <input class="input" type="password" placeholder="••••••••" style="margin-bottom:8px;">
      <div class="flex justify-between items-center" style="margin-bottom:20px;">
        <label style="font-size:13px; color:var(--text-muted); display:flex; align-items:center; gap:6px;"><input type="checkbox"> Beni hatirla</label>
        <a href="forgot-password.html" style="font-size:13px; color:var(--indigo-600); font-weight:600;">Sifremi unuttum</a>
      </div>
      <a href="dashboard.html" class="btn btn-primary" style="width:100%;">Giris Yap</a>
      <div class="divider">veya</div>
      <button class="btn btn-secondary social-btn" style="width:100%; margin-bottom:10px;"><i data-lucide="github" style="width:16px"></i> GitHub ile devam et</button>
      <button class="btn btn-secondary social-btn" style="width:100%;"><i data-lucide="linkedin" style="width:16px"></i> LinkedIn ile devam et</button>
    </div>
    <p class="text-center" style="margin-top:20px; font-size:14px;">Hesabin yok mu? <a href="register.html" style="color:var(--indigo-600); font-weight:700;">Kayit ol</a></p>
  </div>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
